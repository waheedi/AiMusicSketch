name: macOS build and release

on:
  push:
    branches: [main]
    tags: ['v[0-9]*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 25
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate version and release notes
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Info.plist)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            [[ "$GITHUB_REF_NAME" == "v$version" ]]
            test -s "docs/releases/v$version.md"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Validate scripts and test audio scheduling without downloading models
        run: |
          for script in scripts/build-app.sh scripts/package-release.sh scripts/setup-audio.sh; do zsh -n "$script"; done
          python -m pip install numpy==2.2.6
          python -m unittest discover -s scripts -p test_audio_sections.py
      - name: Build universal macOS app (Apple Silicon and Intel)
        run: ./scripts/build-app.sh --universal
      - name: Package, checksum and verify the extracted app
        run: ./scripts/package-release.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-release
          path: |
            build/release/*.zip
            build/release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: macos-release
          path: release-assets
      - name: Publish only after the complete build and upload succeed
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v$RELEASE_VERSION"
          archive="release-assets/AI-Music-Sketchpad-$RELEASE_VERSION-macOS-universal.zip"
          (cd release-assets && sha256sum -c SHA256SUMS.txt)
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft > release-state.json 2>/dev/null; then
            if [[ "$(jq -r .isDraft release-state.json)" != true ]]; then
              echo "Release $tag is already published; leaving its assets unchanged."
              exit 0
            fi
          else
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --verify-tag --draft \
              --title "AI Music Sketchpad $RELEASE_VERSION" --notes-file "docs/releases/$tag.md"
          fi
          gh release upload "$tag" "$archive" release-assets/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false --latest
